<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Favorita</title>
</head>
<body>
    <h1>Mi web favorita</h1>

    <hr>
    <br>

    <input type="url" id="web" placeholder="Ingresa tu WEB favorita: ">

    <button onclick="ingresarWeb()">
        ingresar a la web
    </button>

    <script>
        function ingresarWeb() {

            let url = document.getElementById("web").value;
            
            window.open(url);
        }
    </script>

</body>
</html>
